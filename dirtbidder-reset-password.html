<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>DirtBidder — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --soil:#1C1410; --dig:#2A1F17; --clay:#3D2B1F; --amber:#E8892A; --dust:#C4A882; --stone:#A89887; --chalk:#F2EDE6; --error:#E74C3C; --success:#27AE60; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Barlow', sans-serif; background: var(--soil); color: var(--chalk); min-height: 100vh; display: flex; flex-direction: column; }
  nav { padding: 1rem 1.25rem; border-bottom: 1px solid rgba(232,137,42,0.15); }
  .logo { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 1.5rem; color: var(--chalk); text-decoration: none; }
  .logo span { color: var(--amber); }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
  .box { width: 100%; max-width: 400px; }
  h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 2rem; text-transform: uppercase; margin-bottom: 0.4rem; }
  .sub { color: var(--stone); font-size: 0.92rem; margin-bottom: 1.5rem; }
  label { display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dust); margin-bottom: 0.4rem; }
  input { width: 100%; background: var(--dig); border: 1.5px solid rgba(196,168,130,0.18); color: var(--chalk); border-radius: 3px; padding: 0.8rem 0.9rem; font: inherit; font-size: 1rem; margin-bottom: 1rem; }
  input:focus { outline: none; border-color: var(--amber); }
  button { width: 100%; background: var(--amber); color: var(--soil); border: none; border-radius: 3px; padding: 0.95rem; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 1rem; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  .msg { display: none; border-radius: 3px; padding: 0.8rem 0.9rem; font-size: 0.9rem; margin-bottom: 1rem; }
  .msg.err { display: block; background: rgba(231,76,60,0.1); border: 1px solid rgba(231,76,60,0.35); color: #F2776A; }
  .msg.ok { display: block; background: rgba(39,174,96,0.1); border: 1px solid rgba(39,174,96,0.35); color: #3DCC7E; }
  a.link { color: var(--amber); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<nav><a class="logo" href="index.html"><span>Dirt</span>Bidder</a></nav>
<main>
  <div class="box">
    <h1>New Password</h1>
    <div class="sub">Choose a new password for your DirtBidder account.</div>
    <div class="msg" id="msg" role="alert"></div>
    <form id="form" onsubmit="event.preventDefault(); submitReset();">
      <label for="pw1">New password</label>
      <input type="password" id="pw1" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">
      <label for="pw2">Type it again</label>
      <input type="password" id="pw2" autocomplete="new-password" minlength="8" required>
      <button id="btn" type="submit">Save New Password</button>
    </form>
    <div style="margin-top:1rem;font-size:0.9rem;color:var(--stone)"><a class="link" href="dirtbidder-login.html">← Back to Sign In</a></div>
  </div>
</main>
<script>
  const API_BASE = 'https://dirtbidder-backend-production.up.railway.app';
  const token = new URLSearchParams(location.search).get('token') || '';
  const msg = document.getElementById('msg');
  const show = (cls, text) => { msg.className = 'msg ' + cls; msg.textContent = text; };

  if (!token) {
    show('err', 'This link is missing its reset code. Request a new link from the Sign In page.');
    document.getElementById('form').style.display = 'none';
  }

  async function submitReset() {
    const p1 = document.getElementById('pw1').value, p2 = document.getElementById('pw2').value;
    if (p1.length < 8) return show('err', 'Password must be at least 8 characters.');
    if (p1 !== p2) return show('err', 'The two passwords don’t match.');
    const btn = document.getElementById('btn');
    btn.disabled = true; btn.textContent = 'Saving...';
    try {
      const res = await fetch(API_BASE + '/api/password/reset', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: p1 })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Could not reset password');
      document.getElementById('form').style.display = 'none';
      show('ok', '✓ Password updated. You can sign in now.');
      setTimeout(() => { window.location.href = 'dirtbidder-login.html'; }, 2500);
    } catch (err) {
      show('err', err.message);
      btn.disabled = false; btn.textContent = 'Save New Password';
    }
  }
</script>
<script src="dirtbidder-pixel.js"></script>
<script src="dirtbidder-a11y.js"></script>
</body>
</html>
