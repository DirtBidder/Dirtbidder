<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>DirtBidder — Messages</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --soil: #1C1410; --dig: #2A1F17; --clay: #3D2B1F; --amber: #E8892A;
    --dust: #C4A882; --stone: #A89887; --chalk: #F2EDE6;
    --error: #E74C3C; --success: #27AE60;
    --line: rgba(196,168,130,0.1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Barlow', sans-serif; background: var(--soil); color: var(--chalk); display: flex; flex-direction: column; height: 100dvh; }
  .top { flex: none; display: flex; justify-content: space-between; align-items: center; padding: 0.9rem 1rem; background: var(--dig); border-bottom: 1px solid var(--line); }
  .logo { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 1.35rem; color: var(--chalk); text-decoration: none; }
  .logo span { color: var(--amber); }
  .top a.back { color: var(--dust); font-size: 0.85rem; text-decoration: none; }

  .app { flex: 1; min-height: 0; display: flex; max-width: 1100px; width: 100%; margin: 0 auto; }
  .list { width: 340px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .list-head { padding: 1rem 1rem 0.75rem; }
  .list-head h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 1.6rem; text-transform: uppercase; }
  .list-head h1 span { color: var(--amber); }
  .list-head input { margin-top: 0.6rem; width: 100%; background: var(--dig); border: 1.5px solid rgba(196,168,130,0.18); color: var(--chalk); border-radius: 3px; padding: 0.6rem 0.75rem; font: inherit; font-size: 1rem; }
  .threads { flex: 1; overflow-y: auto; }
  .th { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); color: inherit; font: inherit; padding: 0.85rem 1rem; cursor: pointer; }
  .th:hover { background: rgba(196,168,130,0.04); }
  .th.active { background: rgba(232,137,42,0.08); box-shadow: inset 3px 0 0 var(--amber); }
  .th-row { display: flex; justify-content: space-between; gap: 0.5rem; align-items: baseline; }
  .th-name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .th-time { font-size: 0.72rem; color: var(--stone); flex: none; }
  .th-job { font-size: 0.78rem; color: var(--amber); margin: 0.1rem 0 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .th-last { font-size: 0.83rem; color: var(--stone); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .th.unread .th-name, .th.unread .th-last { color: var(--chalk); }
  .dot { display: inline-block; min-width: 1.2rem; padding: 0 0.35rem; height: 1.2rem; line-height: 1.2rem; border-radius: 0.6rem; background: var(--amber); color: var(--soil); font-size: 0.7rem; font-weight: 700; text-align: center; margin-left: 0.4rem; }

  .convo { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .convo-head { flex: none; padding: 0.85rem 1rem; border-bottom: 1px solid var(--line); display: flex; gap: 0.75rem; align-items: center; }
  .convo-head button.back { display: none; background: none; border: 0; color: var(--amber); font-size: 1.4rem; cursor: pointer; padding: 0 0.25rem; }
  .convo-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 1.1rem; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .convo-sub { font-size: 0.8rem; color: var(--stone); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.15rem 0.45rem; border-radius: 3px; margin-left: 0.35rem; }
  .tag.hired { background: rgba(39,174,96,0.15); color: var(--success); }
  .msgs { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .notice { font-size: 0.8rem; color: var(--stone); background: var(--dig); border: 1px solid var(--line); border-radius: 4px; padding: 0.6rem 0.8rem; margin-bottom: 0.5rem; line-height: 1.4; }
  .day { text-align: center; font-size: 0.72rem; color: var(--stone); margin: 0.5rem 0 0.25rem; }
  .bubble { max-width: 78%; padding: 0.55rem 0.8rem; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  .bubble.them { align-self: flex-start; background: var(--clay); border-bottom-left-radius: 3px; }
  .bubble.me { align-self: flex-end; background: var(--amber); color: var(--soil); border-bottom-right-radius: 3px; }
  .bubble .meta { display: block; font-size: 0.68rem; opacity: 0.9; margin-top: 0.2rem; text-align: right; }
  .bubble .orig { display: block; font-size: 0.78rem; margin-top: 0.35rem; padding-top: 0.35rem; border-top: 1px dashed rgba(0,0,0,0.25); opacity: 0.85; }
  .compose { flex: none; border-top: 1px solid var(--line); padding: 0.7rem; padding-bottom: max(0.7rem, env(safe-area-inset-bottom)); display: flex; gap: 0.5rem; align-items: flex-end; background: var(--soil); }
  .compose textarea { flex: 1; resize: none; max-height: 140px; min-height: 44px; background: var(--dig); border: 1.5px solid rgba(196,168,130,0.2); color: var(--chalk); border-radius: 20px; padding: 0.65rem 0.95rem; font: inherit; font-size: 1rem; line-height: 1.3; }
  .compose textarea:focus { outline: none; border-color: var(--amber); }
  .compose button { flex: none; height: 44px; padding: 0 1.1rem; border-radius: 22px; border: 0; background: var(--amber); color: var(--soil); font-family: 'Barlow Condensed', sans-serif; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.9rem; cursor: pointer; }
  .compose button:disabled { opacity: 0.5; cursor: default; }
  .closed { flex: none; border-top: 1px solid var(--line); padding: 0.9rem 1rem; font-size: 0.85rem; color: var(--stone); text-align: center; }
  .sitebox { align-self: stretch; margin: 0.25rem 0 0.75rem; padding: 0.75rem 0.9rem; border: 1px solid rgba(232,137,42,0.35); border-radius: 6px; background: rgba(232,137,42,0.07); font-size: 0.88rem; line-height: 1.45; color: var(--chalk); }
  .sitebox.plain { border-color: var(--line); background: rgba(255,255,255,0.03); color: var(--dust); }
  .sitebox strong { color: var(--amber); }
  .sitebox.plain strong { color: var(--chalk); }
  .sitebox .dim { font-size: 0.78rem; color: var(--stone); margin-top: 0.3rem; }
  .sitebtn { display: inline-block; margin-top: 0.55rem; padding: 0.55rem 0.9rem; border: 0; border-radius: 4px; background: var(--amber); color: var(--soil); font: inherit; font-weight: 700; font-size: 0.85rem; text-decoration: none; cursor: pointer; }
  .sitebtn:disabled { opacity: 0.5; }
  .sitelink { display: inline-block; margin-top: 0.4rem; color: var(--amber); font-weight: 600; text-decoration: none; font-size: 0.85rem; }
  .tag.ask { background: rgba(52,152,219,0.18); color: #6CB8EC; }
  .empty { margin: auto; text-align: center; color: var(--stone); padding: 2rem 1.25rem; line-height: 1.5; }
  .empty .big { font-size: 2.2rem; margin-bottom: 0.5rem; }
  .err { color: var(--error); padding: 1rem; font-size: 0.9rem; }

  /* Phone: show either the list or the conversation */
  @media (max-width: 760px) {
    .list { width: 100%; border-right: 0; }
    .convo { display: none; }
    body.in-thread .list { display: none; }
    body.in-thread .convo { display: flex; }
    .convo-head button.back { display: block; }
    .bubble { max-width: 86%; }
  }
</style>
<script src="dirtbidder-rules.js" defer></script>
</head>
<body>
<div class="top">
  <a class="logo" id="homeLink" href="dirtbidder-client-dashboard.html"><span>Dirt</span>Bidder</a>
  <a class="back" id="backLink" href="dirtbidder-client-dashboard.html">← Dashboard</a>
</div>
<div class="app" role="main" id="dbMain">
  <div class="list">
    <div class="list-head">
      <h1>My <span>Messages</span></h1>
      <input id="q" type="search" aria-label="Search conversations by name or job" placeholder="Search name or job" oninput="renderThreads()">
    </div>
    <div class="threads" id="threads"><div class="empty">Loading…</div></div>
  </div>
  <div class="convo" id="convo">
    <div class="empty"><div class="big">💬</div>Pick a conversation.</div>
  </div>
</div>

<script>
  const API_BASE = 'https://dirtbidder-backend-production.up.railway.app';
  const token = localStorage.getItem('dirtbidder_token');
  if (!token) window.location.replace('dirtbidder-login.html?next=' + encodeURIComponent(location.pathname.split('/').pop() + location.search));

  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = n => '$' + Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });
  const timeOf = ts => new Date(ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  const dayOf = ts => {
    const d = new Date(ts), now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === now.toDateString()) return 'Today';
    if (d.toDateString() === y.toDateString()) return 'Yesterday';
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  };
  const shortWhen = ts => {
    if (!ts) return '';
    const d = new Date(ts);
    return d.toDateString() === new Date().toDateString() ? timeOf(ts) : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  };

  async function api(path, opts = {}) {
    const res = await fetch(API_BASE + path, { ...opts, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token } });
    if (res.status === 401) { localStorage.removeItem('dirtbidder_token'); window.location.replace('dirtbidder-login.html'); throw new Error('Session expired'); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Something went wrong');
    return data;
  }

  let me = null, threads = [], current = null, sending = false, pollTimer = null, lastCount = -1;
  const key = (j, o) => j + ':' + o;

  // ── Thread list ──
  async function loadThreads() {
    try {
      threads = await api('/api/messages/threads');
      renderThreads();
    } catch (err) {
      document.getElementById('threads').innerHTML = `<div class="err">${esc(err.message)}</div>`;
    }
  }

  function renderThreads() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    const list = threads.filter(t => !q || (t.other_name || '').toLowerCase().includes(q) || (t.job_title || '').toLowerCase().includes(q));
    const el = document.getElementById('threads');
    if (!threads.length) {
      el.innerHTML = `<div class="empty"><div class="big">💬</div>${me && me.role === 'operator'
        ? 'No conversations yet.<br>Tap “Ask a question” on any open job to talk to the client before you bid.'
        : 'No conversations yet.<br>When an operator bids on one of your jobs or asks a question about it, you can message them here.'}</div>`;
      return;
    }
    if (!list.length) { el.innerHTML = '<div class="empty">No matches.</div>'; return; }
    el.innerHTML = list.map(t => {
      const active = current && current.job_id === t.job_id && current.operator_id === t.operator_id;
      const last = t.last_body
        ? (t.last_sender_id === (me && me.id) ? 'You: ' : '') + t.last_body
        : (t.me === 'client' ? `Bid ${money(t.amount)} — say hello` : `You bid ${money(t.amount)}`);
      const hired = t.bid_status === 'accepted' ? '<span class="tag hired">Hired</span>' : t.bid_status == null ? '<span class="tag ask">Question</span>' : '';
      return `<button class="th${active ? ' active' : ''}${t.unread ? ' unread' : ''}" onclick="openThread(${t.job_id}, ${t.operator_id})">
        <div class="th-row"><div class="th-name">${esc(t.other_name || '—')}${hired}${t.unread ? `<span class="dot">${t.unread}</span>` : ''}</div><div class="th-time">${shortWhen(t.last_at)}</div></div>
        <div class="th-job">${esc(t.job_title)}</div>
        <div class="th-last">${esc(last)}</div>
      </button>`;
    }).join('');
  }

  // ── Conversation ──
  async function openThread(jobId, operatorId, fromUrl) {
    document.body.classList.add('in-thread');
    const same = current && current.job_id === jobId && current.operator_id === operatorId;
    if (!same) {
      current = { job_id: jobId, operator_id: operatorId };
      lastCount = -1;
      document.getElementById('convo').innerHTML = '<div class="empty">Loading…</div>';
      if (!fromUrl) history.replaceState(null, '', `?job=${jobId}&op=${operatorId}`);
    }
    renderThreads();
    await refreshThread(true);
    const t = threads.find(x => x.job_id === jobId && x.operator_id === operatorId);
    if (t && t.unread) { t.unread = 0; renderThreads(); }
  }

  async function refreshThread(first) {
    if (!current) return;
    const want = key(current.job_id, current.operator_id);
    try {
      const data = await api(`/api/messages/${current.job_id}/${current.operator_id}`);
      if (!current || key(current.job_id, current.operator_id) !== want) return; // user switched threads meanwhile
      const sig = data.messages.length + '|' + (data.thread.location ? 1 : 0) + '|' + (data.thread.share && data.thread.share.shared ? 1 : 0) + '|' + (data.thread.asking ? 1 : 0) + '|' + data.thread.bid_amount;
      if (!first && sig === lastCount) return; // nothing new; don't disturb typing
      data.sig = sig;
      renderConvo(data, first);
    } catch (err) {
      if (first) document.getElementById('convo').innerHTML = `<div class="empty">${esc(err.message)}<br><br><button onclick="closeThread()" style="background:none;border:0;color:var(--amber);font:inherit;cursor:pointer">← Back to messages</button></div>`;
    }
  }

  function renderConvo(data, first) {
    const t = data.thread, msgs = data.messages;
    const other = t.me === 'client' ? t.operator_name : t.me === 'operator' ? t.client_name : `${t.client_name} ↔ ${t.operator_name}`;
    const convo = document.getElementById('convo');
    const draft = document.getElementById('draft');
    const keep = draft ? draft.value : '';
    const box = document.getElementById('msgs');
    const atBottom = !box || box.scrollHeight - box.scrollTop - box.clientHeight < 80;

    let lastDay = '';
    const bubbles = msgs.map(m => {
      const mine = m.sender_id === t.my_id || (t.me === 'admin' && m.sender_id === t.operator_id);
      const d = dayOf(m.created_at);
      const dayLine = d !== lastDay ? `<div class="day">${d}</div>` : '';
      lastDay = d;
      const who = t.me === 'admin' ? (m.sender_id === t.operator_id ? t.operator_name : t.client_name) + ' · ' : '';
      const seen = m.sender_id === t.my_id && m.read_at ? ' · Seen' : '';
      const orig = m.original_body ? `<span class="orig">Only you see this. The other person saw the hidden version above. What was typed: ${esc(m.original_body)}</span>` : '';
      return `${dayLine}<div class="bubble ${mine ? 'me' : 'them'}">${esc(m.body)}${orig}<span class="meta">${esc(who)}${timeOf(m.created_at)}${seen}</span></div>`;
    }).join('');

    const tip = t.me === 'admin'
      ? 'Admin view — read only. Original text is shown where contact info was hidden.'
      : t.hired
        ? 'You’re working together on this job. Keep job talk here so there’s a record if anything goes wrong. DirtBidder can read messages to settle disputes and enforce the rules.'
        : 'Phone numbers, emails and links are hidden until the job is hired. All payments go through DirtBidder escrow — that’s what protects you both. <a href="dirtbidder-how-it-works.html#contact" style="color:var(--amber)">Why?</a> DirtBidder can read messages to settle disputes and enforce the rules.';

    // Operator: where the job is, once hired or once the client shares it so they can look at the site
    let extra = '';
    if (t.location) {
      const L = t.location, hasPin = L.lat != null && L.lng != null;
      const street = String(L.address || '').split('\n').find(l => !/^Access:/i.test(l)) || '';
      const access = String(L.address || '').split('\n').find(l => /^Access:/i.test(l)) || '';
      const dest = hasPin ? Number(L.lat) + ',' + Number(L.lng) : street;
      extra += `<div class="sitebox"><strong>📍 ${t.hired ? 'Job site' : esc(t.client_name || 'The client') + ' shared the job location with you'}</strong>
        <div>${street ? esc(street) : 'No street address — use the GPS pin.'}</div>${access ? `<div class="dim">${esc(access)}</div>` : ''}
        ${dest ? `<a class="sitebtn" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}" target="_blank" rel="noopener">🧭 Get Directions${hasPin ? ' to the Pin' : ''}</a>` : ''}
        ${t.hired ? '' : `<div class="dim">Go take a look, then ${t.asking ? 'place your bid' : 'update your bid if you need to'}. If you get the job, it’s hired and paid through DirtBidder. <a class="sitelink" style="margin:0" href="dirtbidder-how-it-works.html#rules">Why?</a></div>`}</div>`;
    }
    if (t.me === 'operator' && t.can_send && !t.hired && (t.asking || t.bid_status === 'pending')) {
      extra += `<div class="sitebox plain">${t.asking ? 'You haven’t bid on this job yet. Ask what you need to price it right.' : `Your bid: <strong>${money(t.bid_amount)}</strong>. You can change it until the client accepts.`}
        <a class="sitelink" href="dirtbidder-operator-dashboard.html#${t.asking ? 'browse' : 'mybids'}">${t.asking ? 'Place your bid →' : 'Update your bid →'}</a></div>`;
    }
    // Client: let this one operator see where the job is before hiring
    if (t.share && t.share.can_share) {
      const name = esc(t.operator_name || 'this operator');
      extra += t.share.shared
        ? `<div class="sitebox"><strong>✓ ${name} can see the job location</strong><div class="dim">They got the address and GPS pin so they can look at the site. Your phone number stays hidden until you hire them. If you pick them, hire them here so your payment is protected.</div>
           <a class="sitelink" href="#" onclick="event.preventDefault();shareLocation(false)">Stop sharing</a></div>`
        : t.share.has_location
          ? `<div class="sitebox plain">${t.asking ? name + ' hasn’t bid yet.' : ''} Want them to look at the site before ${t.asking ? 'they price it' : 'you decide'}?
             <button class="sitebtn" id="shareBtn" onclick="shareLocation(true)">📍 Share the job location with ${name}</button>
             <div class="dim">Only they see the address and GPS pin. Your phone number stays hidden until you hire.</div></div>`
          : `<div class="sitebox plain"><span class="dim">To let ${name} look at the site, add the job address or drop a GPS pin on it in <a class="sitelink" style="margin:0" href="dirtbidder-client-dashboard.html">My Jobs</a>. Then you can share it here.</span></div>`;
    }

    convo.innerHTML = `
      <div class="convo-head">
        <button class="back" onclick="closeThread()" aria-label="Back">‹</button>
        <div style="min-width:0">
          <div class="convo-title" role="heading" aria-level="2">${esc(other || '—')}${t.hired ? '<span class="tag hired">Hired</span>' : ''}</div>
          <div class="convo-sub">${esc(t.job_title)}</div>
        </div>
      </div>
      <div class="msgs" id="msgs">
        <div class="notice">${tip}</div>
        ${extra}
        ${bubbles || `<div class="empty" style="margin:1rem auto">No messages yet.${t.can_send ? ' Say hello 👋' : ''}</div>`}
      </div>
      ${t.can_send ? `<div class="compose">
        <textarea id="draft" rows="1" aria-label="Type a message" placeholder="Message ${esc(other || '')}" oninput="grow(this)" onkeydown="enterSend(event)"></textarea>
        <button id="sendBtn" onclick="send()">Send</button>
      </div>` : `<div class="closed">${esc(t.closed_reason || 'Read only')}</div>`}`;

    const nd = document.getElementById('draft');
    if (nd) { nd.value = keep; grow(nd); if (first && window.innerWidth > 760) nd.focus(); }
    const nb = document.getElementById('msgs');
    if (first || atBottom) nb.scrollTop = nb.scrollHeight;
    lastCount = data.sig;
  }

  function grow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 140) + 'px'; }
  function enterSend(e) {
    // Enter sends on desktop; on phones Enter makes a new line (tap Send)
    if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(pointer: fine)').matches) { e.preventDefault(); send(); }
  }

  async function send() {
    const el = document.getElementById('draft');
    const body = el.value.trim();
    if (!body || sending || !current) return;
    sending = true;
    const btn = document.getElementById('sendBtn'); btn.disabled = true;
    try {
      const r = await api(`/api/messages/${current.job_id}/${current.operator_id}`, { method: 'POST', body: JSON.stringify({ body }) });
      el.value = ''; grow(el);
      await refreshThread(true);
      if (r.hidden) alert('Heads up: contact info was hidden in your message. It’s shared automatically once the job is hired.');
      loadThreads();
    } catch (err) {
      alert(err.message);
    } finally {
      sending = false;
      const b = document.getElementById('sendBtn'); if (b) b.disabled = false;
    }
  }

  // Client: show (or stop showing) this operator where the job is
  async function shareLocation(share) {
    if (!current) return;
    if (!share && !confirm('Stop sharing the job location with this operator?')) return;
    // First time sharing a location: agree to the one house rule, once
    if (share && window.DirtRules && !(await DirtRules.ensure('client'))) return;
    const btn = document.getElementById('shareBtn'); if (btn) btn.disabled = true;
    try {
      await api('/api/jobs/' + current.job_id + '/share-location', { method: 'POST', body: JSON.stringify({ operator_id: current.operator_id, share }) });
      await refreshThread(true);
    } catch (err) { alert(err.message); if (btn) btn.disabled = false; }
  }

  function closeThread() {
    current = null;
    document.body.classList.remove('in-thread');
    history.replaceState(null, '', location.pathname);
    document.getElementById('convo').innerHTML = '<div class="empty"><div class="big">💬</div>Pick a conversation.</div>';
    loadThreads();
  }

  // Check for new messages: open thread every 8s, list every 20s (only while the tab is visible)
  function startPolling() {
    let n = 0;
    clearInterval(pollTimer);
    pollTimer = setInterval(() => {
      if (document.hidden) return;
      n++;
      if (current) refreshThread(false);
      if (n % 3 === 0) loadThreads();
    }, 8000);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadThreads(); if (current) refreshThread(false); } });

  async function init() {
    try {
      me = await api('/api/me');
      const dash = me.role === 'operator' ? 'dirtbidder-operator-dashboard.html' : 'dirtbidder-client-dashboard.html';
      document.getElementById('homeLink').href = dash;
      document.getElementById('backLink').href = dash;
    } catch (err) { /* list still loads */ }
    await loadThreads();
    const p = new URLSearchParams(location.search);
    const job = parseInt(p.get('job'), 10);
    let op = parseInt(p.get('op'), 10);
    if (job && !op && me && me.role === 'operator') op = me.id; // operators can link with just ?job=
    if (job && op) openThread(job, op, true);
    startPolling();
  }
  if (token) init();
</script>
<script src="dirtbidder-a11y.js"></script>
</body>
</html>
