<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>DirtBidder — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --soil: #1C1410; --dig: #2A1F17; --clay: #3D2B1F; --amber: #E8892A;
    --dust: #C4A882; --stone: #8C7B6B; --chalk: #F2EDE6;
    --error: #E74C3C; --success: #27AE60; --info: #3498DB;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Barlow', sans-serif; background: var(--soil); color: var(--chalk); min-height: 100vh; }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.25rem; background: var(--dig); border-bottom: 1px solid rgba(196,168,130,0.08); position: sticky; top: 0; z-index: 5; }
  .logo { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 1.4rem; color: var(--chalk); text-decoration: none; }
  .logo span { color: var(--amber); }
  .top a.back { color: var(--dust); font-size: 0.85rem; text-decoration: none; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 2rem; text-transform: uppercase; margin-bottom: 0.25rem; }
  h1 span { color: var(--amber); }
  .sub { color: var(--stone); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .tab { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.8rem; padding: 0.45rem 0.9rem; border-radius: 3px; border: 1px solid rgba(196,168,130,0.2); background: transparent; color: var(--dust); cursor: pointer; }
  .tab.active { background: var(--amber); border-color: var(--amber); color: var(--soil); }
  .card { background: var(--dig); border: 1px solid rgba(196,168,130,0.1); border-radius: 4px; margin-bottom: 1rem; overflow: hidden; }
  .card-head { padding: 1rem 1.25rem; border-bottom: 1px solid rgba(196,168,130,0.08); display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .card-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 1.05rem; text-transform: uppercase; }
  .pill { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.2rem 0.55rem; border-radius: 3px; white-space: nowrap; align-self: flex-start; }
  .pill.open { background: rgba(231,76,60,0.15); color: var(--error); }
  .pill.done { background: rgba(140,123,107,0.18); color: var(--stone); }
  .card-body { padding: 1rem 1.25rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0.9rem; margin-bottom: 1rem; }
  .lbl { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--stone); margin-bottom: 0.2rem; }
  .val { font-size: 0.9rem; color: var(--chalk); word-break: break-word; }
  .val small { color: var(--dust); }
  .quote { font-size: 0.9rem; color: var(--dust); background: var(--clay); border-radius: 3px; padding: 0.7rem 0.85rem; margin-bottom: 0.75rem; white-space: pre-wrap; }
  .thumbs { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
  .thumbs img { width: 80px; height: 80px; object-fit: cover; border-radius: 3px; border: 1px solid rgba(196,168,130,0.15); }
  .decide { border-top: 1px solid rgba(196,168,130,0.08); padding-top: 1rem; }
  .decide textarea, .decide input { width: 100%; background: var(--clay); border: 1.5px solid rgba(196,168,130,0.18); color: var(--chalk); border-radius: 3px; padding: 0.55rem 0.7rem; font: inherit; font-size: 0.88rem; }
  .decide textarea { min-height: 60px; margin-bottom: 0.6rem; }
  .btns { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  .btn { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.55rem 0.95rem; border-radius: 3px; cursor: pointer; border: 1px solid; background: transparent; }
  .btn.release { color: var(--success); border-color: rgba(39,174,96,0.5); }
  .btn.refund { color: var(--error); border-color: rgba(231,76,60,0.5); }
  .btn.split { color: var(--amber); border-color: rgba(232,137,42,0.5); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .split-row { display: none; gap: 0.5rem; align-items: center; margin-top: 0.6rem; flex-wrap: wrap; }
  .split-row.show { display: flex; }
  .split-row input { width: 140px; }
  .empty { text-align: center; padding: 3rem 1rem; color: var(--stone); }
  .msg { padding: 1rem 1.25rem; color: var(--error); }
</style>
</head>
<body>
<div class="top">
  <a class="logo" href="dirtbidder-client-dashboard.html"><span>Dirt</span>Bidder</a>
  <a class="back" href="dirtbidder-client-dashboard.html">← Back to dashboard</a>
</div>
<div class="wrap">
  <h1>Admin — <span>DirtBidder</span></h1>
  <div class="sub" id="tabSub">Clients who reported a problem. Their payment is frozen until you decide.</div>
  <div class="tabs" style="flex-wrap:wrap">
    <button class="tab active" data-f="open" onclick="setTab(this)">Open Disputes</button>
    <button class="tab" data-f="resolved" onclick="setTab(this)">Resolved</button>
    <button class="tab" data-f="held" onclick="setTab(this)">Paid Jobs</button>
    <button class="tab" data-f="flags" onclick="setTab(this)">🚩 Flagged <span id="flagCount"></span></button>
    <button class="tab" data-f="users" onclick="setTab(this)">Users</button>
    <button class="tab" data-f="bids" onclick="setTab(this)">All Bids</button>
  </div>
  <div id="bidSearch" style="display:none;margin-bottom:1rem">
    <input id="bidQ" type="search" placeholder="Search job, location, operator or client" oninput="searchBids()" style="width:100%;background:var(--dig);border:1.5px solid rgba(196,168,130,0.2);color:var(--chalk);border-radius:3px;padding:0.75rem 0.9rem;font:inherit;font-size:1rem;margin-bottom:0.6rem">
    <div class="tabs" id="bidStatus" style="flex-wrap:wrap;margin-bottom:0"></div>
  </div>
  <div id="userSearch" style="display:none;margin-bottom:1rem">
    <input id="userQ" type="search" placeholder="Search name, company, email or phone" oninput="searchUsers()" style="width:100%;background:var(--dig);border:1.5px solid rgba(196,168,130,0.2);color:var(--chalk);border-radius:3px;padding:0.75rem 0.9rem;font:inherit;font-size:1rem">
  </div>
  <div id="list"><div class="empty">Loading…</div></div>
</div>

<script>
  const API_BASE = 'https://dirtbidder-backend-production.up.railway.app';
  const token = localStorage.getItem('dirtbidder_token');
  if (!token) window.location.replace('dirtbidder-login.html');
  let disputes = [], tab = 'open';

  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = n => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const when = ts => ts ? new Date(ts).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';

  async function api(path, opts = {}) {
    const res = await fetch(API_BASE + path, { ...opts, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token } });
    if (res.status === 401) { window.location.replace('dirtbidder-login.html'); throw new Error('Session expired'); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  function card(d) {
    const open = d.status === 'open';
    const photos = Array.isArray(d.photos) ? d.photos : [];
    const outcome = { release: 'Paid to operator', refund: 'Refunded to client', split: 'Split' }[d.resolution] || '';
    return `<div class="card">
      <div class="card-head">
        <div><div class="card-title">${esc(d.job_title)}</div><div style="font-size:0.8rem;color:var(--stone)">${esc(d.job_location || '')} · reported ${when(d.created_at)}</div></div>
        <div class="pill ${open ? 'open' : 'done'}">${open ? 'Open' : outcome}</div>
      </div>
      <div class="card-body">
        <div class="grid">
          <div><div class="lbl">Client</div><div class="val">${esc(d.client_name || '—')}<br><small>${esc(d.client_email || '')}</small></div></div>
          <div><div class="lbl">Operator</div><div class="val">${esc(d.operator_name || '—')}<br><small>${esc(d.operator_email || '')}</small></div></div>
          <div><div class="lbl">Job amount</div><div class="val">${money(d.escrow_amount)}</div></div>
          <div><div class="lbl">Client paid</div><div class="val">${money(d.client_total)} <small>(incl. ${money(d.client_fee)} fee)</small></div></div>
        </div>
        <div class="lbl">Client says</div>
        <div class="quote">${esc(d.reason)}</div>
        ${photos.length ? `<div class="thumbs">${photos.map(t => `<a href="${API_BASE}/api/photos/${encodeURIComponent(t)}" target="_blank" rel="noopener"><img src="${API_BASE}/api/photos/${encodeURIComponent(t)}" alt="Evidence photo" loading="lazy"></a>`).join('')}</div>` : ''}
        <div class="lbl">Operator says</div>
        <div class="quote">${d.operator_response ? esc(d.operator_response) : '<span style="color:var(--stone)">No response yet</span>'}</div>
        ${open ? `<div class="decide">
          <div class="lbl">Note to both sides (optional)</div>
          <textarea id="note-${d.id}" placeholder="Short reason for your decision"></textarea>
          <div class="btns">
            <button class="btn release" onclick="resolve(${d.id}, 'release', this)">Pay Operator ${money(d.escrow_amount)}</button>
            <button class="btn refund" onclick="resolve(${d.id}, 'refund', this)">Full Refund ${money(d.client_total)}</button>
            <button class="btn split" onclick="document.getElementById('split-${d.id}').classList.toggle('show')">Split…</button>
          </div>
          <div class="split-row" id="split-${d.id}">
            <span style="font-size:0.85rem;color:var(--dust)">Operator gets $</span>
            <input type="number" min="1" step="0.01" id="amt-${d.id}" placeholder="e.g. 7000">
            <span style="font-size:0.8rem;color:var(--stone)">of ${money(d.escrow_amount)}; client is refunded the rest of the job amount</span>
            <button class="btn split" onclick="resolve(${d.id}, 'split', this)">Confirm Split</button>
          </div>
        </div>` : `<div class="lbl">Decision</div><div class="val" style="margin-bottom:0.3rem">${outcome}${d.resolution !== 'release' && d.refund_amount ? ' — refunded ' + money(d.refund_amount) : ''}${d.operator_amount ? ' — operator ' + money(d.operator_amount) : ''} · ${when(d.resolved_at)}</div>${d.admin_note ? `<div class="quote">${esc(d.admin_note)}</div>` : ''}`}
      </div>
    </div>`;
  }

  let escrows = [];
  function heldCard(e) {
    return `<div class="card">
      <div class="card-head">
        <div><div class="card-title">${esc(e.title)}</div><div style="font-size:0.8rem;color:var(--stone)">Paid ${when(e.created_at)} · ${esc(e.job_status.replace('_', ' '))}</div></div>
        <div class="pill open">Held</div>
      </div>
      <div class="card-body">
        <div class="grid">
          <div><div class="lbl">Client</div><div class="val">${esc(e.client_name || '—')}<br><small>${esc(e.client_email || '')}</small></div></div>
          <div><div class="lbl">Operator</div><div class="val">${esc(e.operator_name || '—')}<br><small>${esc(e.operator_email || '')}</small></div></div>
          <div><div class="lbl">Job amount</div><div class="val">${money(e.amount)}</div></div>
          <div><div class="lbl">Client paid</div><div class="val">${money(e.client_total)}</div></div>
        </div>
        <div style="font-size:0.82rem;color:var(--stone);margin:0.5rem 0 0.75rem">Only use this when <strong style="color:var(--chalk)">both sides agreed</strong> to cancel before work started. If they disagree, the client should use Report a Problem instead.</div>
        <button class="btn refund" onclick="cancelHeld(${e.id}, this)">Cancel Job &amp; Refund ${money(e.client_total)}</button>
      </div>
    </div>`;
  }

  async function cancelHeld(id, btn) {
    const e = escrows.find(x => x.id === id);
    if (!confirm(`Cancel "${e.title}" and refund the client ${money(e.client_total)} (fee included)? The operator gets nothing.\n\nThis can’t be undone.`)) return;
    btn.disabled = true;
    try { await api('/api/disputes/admin/escrows/' + id + '/cancel', { method: 'POST' }); await load(); }
    catch (err) { alert(err.message); btn.disabled = false; }
  }

  // ── Users: search, suspend, restore ──
  let users = [], userTimer = null;
  function searchUsers() {
    clearTimeout(userTimer);
    userTimer = setTimeout(loadUsers, 300);
  }
  async function loadUsers() {
    try {
      users = await api('/api/admin/users?q=' + encodeURIComponent(document.getElementById('userQ').value.trim()));
      if (tab === 'users') render();
    } catch (err) { document.getElementById('list').innerHTML = `<div class="card"><div class="msg">${esc(err.message)}</div></div>`; }
  }
  function userCard(u) {
    const sus = !!u.suspended_at;
    const warns = Array.isArray(u.warnings) ? u.warnings : [];
    const r = u.reputation;
    const stats = u.role === 'operator'
      ? `${u.bids_made} bid${u.bids_made === 1 ? '' : 's'}${r ? ` · ${r.jobs} job${r.jobs === 1 ? '' : 's'} done${r.review_count ? ` · ★ ${Number(r.rating).toFixed(1)} (${r.review_count})` : ''}${r.badge ? ' · ' + r.badge.icon + ' ' + esc(r.badge.label) : ''}` : ''}`
      : `${u.jobs_posted} job${u.jobs_posted === 1 ? '' : 's'} posted`;
    return `<div class="card">
      <div class="card-head">
        <div><div class="card-title">${esc(u.company_name || u.name || '—')}</div>
          <div style="font-size:0.8rem;color:var(--stone)">${esc(u.role === 'operator' ? 'Operator' : u.role === 'client' ? 'Client' : u.role)}${u.company_name && u.name ? ' · ' + esc(u.name) : ''} · joined ${when(u.created_at)}</div></div>
        <div class="pill ${sus ? 'open' : 'done'}">${sus ? 'Suspended' : u.is_admin ? 'Admin' : 'Active'}</div>
      </div>
      <div class="card-body">
        <div class="val" style="margin-bottom:0.3rem">${esc(u.email)}${u.phone ? ' · ' + esc(u.phone) : ''}</div>
        <div style="font-size:0.85rem;color:var(--dust);margin-bottom:0.6rem">${stats}${u.disputes ? ` · <span style="color:var(--error)">${u.disputes} dispute${u.disputes === 1 ? '' : 's'}</span>` : ''}${warns.length ? ` · <span style="color:var(--amber)">${warns.length} warning${warns.length === 1 ? '' : 's'}</span>` : ''}${u.money_held ? ` · <span style="color:var(--amber)">${u.money_held} payment${u.money_held === 1 ? '' : 's'} in escrow</span>` : ''}</div>
        ${sus ? `<div class="lbl">Suspended ${when(u.suspended_at)} — reason</div><div class="quote">${esc(u.suspended_reason || '')}</div>
          <button class="btn release" onclick="restoreUser(${u.id}, this)">Restore Account</button>`
        : u.is_admin ? '' : `${warns.length ? `<div class="lbl">${warns.length} warning${warns.length === 1 ? '' : 's'} sent</div>${warns.map(w => `<div class="quote" style="margin-bottom:0.4rem">${esc(w.reason)} <small style="color:var(--stone)">— ${when(w.created_at)}</small></div>`).join('')}` : ''}
          <div class="lbl">What did they do? (they'll see this in the email)</div>
          <textarea id="sus-${u.id}" style="width:100%;min-height:70px;background:var(--clay);border:1.5px solid rgba(196,168,130,0.18);color:var(--chalk);border-radius:3px;padding:0.6rem;font:inherit;font-size:0.9rem;margin-bottom:0.5rem" placeholder="e.g. You asked a client to pay you in cash outside DirtBidder."></textarea>
          <div class="btns">
            <button class="btn split" onclick="warnUser(${u.id}, this)">Send Warning</button>
            <button class="btn refund" onclick="suspendUser(${u.id}, this)">Suspend Account</button>
          </div>`}
      </div>
    </div>`;
  }
  async function warnUser(id, btn) {
    const u = users.find(x => x.id === id);
    const reason = document.getElementById('sus-' + id).value.trim();
    if (reason.length < 5) { alert('Write what they did wrong first — they will see it.'); return; }
    if (!confirm(`Email ${u.email} a warning?\n\n"${reason}"\n\nTheir account stays active.`)) return;
    btn.disabled = true;
    try { await api('/api/admin/users/' + id + '/warn', { method: 'POST', body: JSON.stringify({ reason }) }); await loadUsers(); }
    catch (err) { alert(err.message); btn.disabled = false; }
  }

  async function suspendUser(id, btn) {
    const u = users.find(x => x.id === id);
    const reason = document.getElementById('sus-' + id).value.trim();
    if (!reason) { alert('Write a short reason first.'); return; }
    let msg = `Suspend ${u.company_name || u.name || u.email}?\n\nThey'll get an email with your reason, be signed out, and can't sign in. Their open jobs come down and their pending bids are pulled.`;
    if (u.money_held) msg += `\n\nThey have ${u.money_held} payment(s) in escrow. Those are NOT touched — handle them on the Paid Jobs or Disputes tab.`;
    if (!confirm(msg + '\n\nYou can restore them later.')) return;
    btn.disabled = true;
    try { await api('/api/admin/users/' + id + '/suspend', { method: 'POST', body: JSON.stringify({ reason }) }); await loadUsers(); }
    catch (err) { alert(err.message); btn.disabled = false; }
  }
  async function restoreUser(id, btn) {
    if (!confirm('Restore this account? They can sign in again. Jobs and bids that were taken down stay down.')) return;
    btn.disabled = true;
    try { await api('/api/admin/users/' + id + '/restore', { method: 'POST' }); await loadUsers(); }
    catch (err) { alert(err.message); btn.disabled = false; }
  }

  // ── Flagged: contact info in bids/posts/profiles, client reports, patterns ──
  let flags = [];
  const KIND = { bid: 'Bid', job: 'Job post', profile: 'Profile', report: 'Client report', pattern: 'Pattern' };
  async function loadFlags() {
    try {
      flags = await api('/api/admin/flags');
      document.getElementById('flagCount').textContent = flags.length ? '(' + flags.length + ')' : '';
      if (tab === 'flags') render();
    } catch (err) { /* shown on tab open */ }
  }
  function flagCard(f) {
    return `<div class="card">
      <div class="card-head">
        <div><div class="card-title">${esc(f.company_name || f.name || f.email)}</div>
          <div style="font-size:0.8rem;color:var(--stone)">${esc(f.role === 'operator' ? 'Operator' : 'Client')} · ${esc(f.email)} · ${when(f.created_at)}</div></div>
        <div class="pill open">${KIND[f.kind] || f.kind}</div>
      </div>
      <div class="card-body">
        <div class="val" style="margin-bottom:0.5rem">${esc(f.reason)}</div>
        ${f.job_title ? `<div style="font-size:0.82rem;color:var(--stone);margin-bottom:0.4rem">Job: ${esc(f.job_title)}</div>` : ''}
        ${f.reporter_email ? `<div style="font-size:0.82rem;color:var(--stone);margin-bottom:0.4rem">Reported by ${esc(f.reporter_name || '')} (${esc(f.reporter_email)})</div>` : ''}
        ${f.details ? `<div class="lbl">${f.kind === 'report' ? 'What they said' : 'What they actually wrote (hidden from the other side)'}</div><div class="quote" style="white-space:pre-line">${esc(f.details)}</div>` : ''}
        <div style="font-size:0.82rem;color:var(--dust);margin:0.4rem 0 0.6rem">${f.total_flags} flag${f.total_flags === 1 ? '' : 's'} total · ${f.warnings} warning${f.warnings === 1 ? '' : 's'}${f.suspended_at ? ' · <span style="color:var(--error)">suspended</span>' : ''}</div>
        <div class="btns">
          <button class="btn split" onclick="goUser('${esc(f.email)}')">Warn or Suspend…</button>
          <button class="btn release" onclick="flagDone(${f.id}, this)">Mark Handled</button>
        </div>
      </div>
    </div>`;
  }
  function goUser(email) {
    document.getElementById('userQ').value = email;
    setTab(document.querySelector('[data-f=users]'));
    loadUsers();
  }
  async function flagDone(id, btn) {
    btn.disabled = true;
    try { await api('/api/admin/flags/' + id + '/done', { method: 'POST' }); await loadFlags(); }
    catch (err) { alert(err.message); btn.disabled = false; }
  }

  // ── All Bids: every bid on the platform, newest first ──
  let bids = [], bidCounts = {}, bidStatus = '', bidTimer = null, bidsLoaded = false;
  const BID_STATUS = { '': 'All', pending: 'Pending', accepted: 'Accepted', declined: 'Declined', withdrawn: 'Withdrawn' };
  const BID_PILL = { pending: 'split', accepted: 'release', declined: 'done', withdrawn: 'done' };
  function searchBids() {
    clearTimeout(bidTimer);
    bidTimer = setTimeout(loadBids, 300);
  }
  function setBidStatus(s) { bidStatus = s; loadBids(); }
  async function loadBids() {
    try {
      const q = document.getElementById('bidQ').value.trim();
      const data = await api('/api/admin/bids?q=' + encodeURIComponent(q) + '&status=' + encodeURIComponent(bidStatus));
      bids = data.bids || []; bidCounts = data.counts || {}; bidsLoaded = true;
      if (tab === 'bids') render();
    } catch (err) { if (tab === 'bids') document.getElementById('list').innerHTML = `<div class="card"><div class="msg">${esc(err.message)}</div></div>`; }
  }
  function bidStatusChips() {
    const total = Object.values(bidCounts).reduce((a, b) => a + b, 0);
    document.getElementById('bidStatus').innerHTML = Object.entries(BID_STATUS).map(([k, label]) =>
      `<button class="tab${bidStatus === k ? ' active' : ''}" onclick="setBidStatus('${k}')">${label} (${k ? (bidCounts[k] || 0) : total})</button>`).join('');
  }
  function bidCard(b) {
    const pillColor = { split: 'background:rgba(232,137,42,0.15);color:var(--amber)', release: 'background:rgba(39,174,96,0.15);color:var(--success)' }[BID_PILL[b.status]] || '';
    const vsBudget = b.job_budget ? ` <small>(budget ${money(b.job_budget)})</small>` : '';
    return `<div class="card">
      <div class="card-head">
        <div><div class="card-title">${esc(b.job_title)}</div>
          <div style="font-size:0.8rem;color:var(--stone)">${esc(b.job_location || '')} · bid ${when(b.created_at)} · job ${esc(String(b.job_status || '').replace('_', ' '))} · ${b.bids_on_job} bid${b.bids_on_job === 1 ? '' : 's'} on job</div></div>
        <div class="pill done" style="${pillColor}">${esc(BID_STATUS[b.status] || b.status || 'Pending')}</div>
      </div>
      <div class="card-body">
        <div class="grid">
          <div><div class="lbl">Bid</div><div class="val">${money(b.amount)}${vsBudget}</div></div>
          <div><div class="lbl">Operator</div><div class="val">${esc(b.operator_company || b.operator_name || '—')}<br><small>${esc(b.operator_email || '')}</small></div></div>
          <div><div class="lbl">Client</div><div class="val">${esc(b.client_name || '—')}<br><small>${esc(b.client_email || '')}</small></div></div>
          ${b.est_days || b.equipment ? `<div><div class="lbl">Days / Equipment</div><div class="val">${b.est_days ? esc(b.est_days) + ' days' : '—'}${b.equipment ? '<br><small>' + esc(b.equipment) + '</small>' : ''}</div></div>` : ''}
        </div>
        ${b.message ? `<div class="lbl">Operator's message</div><div class="quote">${esc(b.message)}</div>` : ''}
        ${b.operator_suspended || b.operator_open_flags ? `<div style="font-size:0.82rem;margin-bottom:0.6rem">${b.operator_suspended ? '<span style="color:var(--error)">Operator suspended</span>' : ''}${b.operator_suspended && b.operator_open_flags ? ' · ' : ''}${b.operator_open_flags ? `<span style="color:var(--amber)">🚩 ${b.operator_open_flags} open flag${b.operator_open_flags === 1 ? '' : 's'}</span>` : ''}</div>` : ''}
        <div class="btns"><button class="btn split" onclick="goUser('${esc(b.operator_email)}')">View Operator…</button></div>
      </div>
    </div>`;
  }

  function render() {
    document.getElementById('bidSearch').style.display = tab === 'bids' ? '' : 'none';
    if (tab === 'bids') {
      document.getElementById('userSearch').style.display = 'none';
      document.getElementById('tabSub').textContent = 'Every bid on DirtBidder, newest first. Spot lowballs, bid-shopping, or operators who need a look.';
      bidStatusChips();
      document.getElementById('list').innerHTML = !bidsLoaded ? '<div class="empty">Loading…</div>'
        : bids.length ? bids.map(bidCard).join('') : '<div class="empty">No bids found.</div>';
      return;
    }
    if (tab === 'flags') {
      document.getElementById('userSearch').style.display = 'none';
      document.getElementById('tabSub').textContent = 'Things that look like someone trying to deal outside DirtBidder, plus client reports. Warn, suspend, or mark handled if it’s nothing.';
      document.getElementById('list').innerHTML = flags.length ? flags.map(flagCard).join('') : '<div class="empty">Nothing flagged. 👍</div>';
      return;
    }
    document.getElementById('userSearch').style.display = tab === 'users' ? '' : 'none';
    if (tab === 'users') {
      document.getElementById('tabSub').textContent = 'Everyone on DirtBidder. Suspend anyone breaking the rules — they’re signed out and blocked, but their records are kept.';
      document.getElementById('list').innerHTML = users.length ? users.map(userCard).join('') : '<div class="empty">No users found.</div>';
      return;
    }
    document.getElementById('tabSub').textContent = tab === 'held'
      ? 'Jobs that are paid and in escrow, with no dispute. Cancel one here if both sides agreed to call it off.'
      : 'Clients who reported a problem. Their payment is frozen until you decide.';
    if (tab === 'held') {
      document.getElementById('list').innerHTML = escrows.length ? escrows.map(heldCard).join('') : '<div class="empty">No paid jobs in escrow right now.</div>';
      return;
    }
    const list = disputes.filter(d => tab === 'open' ? d.status === 'open' : d.status !== 'open');
    document.getElementById('list').innerHTML = list.length ? list.map(card).join('')
      : `<div class="empty">${tab === 'open' ? 'No open disputes. 👍' : 'No resolved disputes yet.'}</div>`;
  }

  function setTab(btn) {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tab = btn.dataset.f;
    render();
    if (tab === 'bids') loadBids();
  }

  async function resolve(id, resolution, btn) {
    const d = disputes.find(x => x.id === id);
    const note = document.getElementById('note-' + id).value.trim();
    const body = { resolution, note };
    let msg;
    if (resolution === 'release') msg = `Pay the operator the full ${money(d.escrow_amount)}? (They receive it minus their fee.)`;
    if (resolution === 'refund') msg = `Refund the client the full ${money(d.client_total)}? The operator gets nothing.`;
    if (resolution === 'split') {
      const amt = Number(document.getElementById('amt-' + id).value);
      if (!(amt > 0 && amt < Number(d.escrow_amount))) { alert('Enter an operator amount between $0 and ' + money(d.escrow_amount)); return; }
      body.operator_amount = amt;
      msg = `Operator gets ${money(amt)} (minus their fee). Client is refunded ${money(Number(d.escrow_amount) - amt)}. Continue?`;
    }
    if (!confirm(msg + '\n\nThis can’t be undone.')) return;
    btn.disabled = true;
    try {
      await api('/api/disputes/admin/' + id + '/resolve', { method: 'POST', body: JSON.stringify(body) });
      await load();
    } catch (err) { alert(err.message); btn.disabled = false; }
  }

  async function load() {
    try {
      [disputes, escrows] = await Promise.all([api('/api/disputes/admin/all'), api('/api/disputes/admin/escrows')]);
      render();
      loadUsers();
      loadFlags();
    } catch (err) {
      document.getElementById('list').innerHTML = `<div class="card"><div class="msg">${esc(err.message)}${/Admin/.test(err.message) ? ' — log in with daniel@dirtbidder.com.' : ''}</div></div>`;
    }
  }
  if (token) load();
</script>
</body>
</html>
